version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sisampah_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - sisampah_network
    depends_on:
      - db
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sisampah
      - DB_USERNAME=sisampah
      - DB_PASSWORD=sisampah_password
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync

  db:
    image: mysql:8.0
    container_name: sisampah_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sisampah
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: sisampah_password
      MYSQL_USER: sisampah
    volumes:
      - sisampah_mysql:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - sisampah_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: sisampah_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sisampah_network
    depends_on:
      - app

networks:
  sisampah_network:
    driver: bridge

volumes:
  sisampah_mysql:
    driver: local
