<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1f17"/>
      <stop offset="40%" stop-color="#0d2b1f"/>
      <stop offset="100%" stop-color="#051410"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#68dbae" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="1200" fill="url(#bg)"/>
  <rect width="800" height="1200" fill="url(#glow)"/>
  <rect width="800" height="1200" fill="url(#dots)"/>
  <!-- Recycling bins -->
  <g opacity="0.12" fill="#68dbae">
    <rect x="80" y="200" width="60" height="80" rx="8"/>
    <rect x="90" y="180" width="40" height="20" rx="4"/>
    <rect x="620" y="350" width="50" height="70" rx="6"/>
    <rect x="628" y="335" width="34" height="15" rx="3"/>
    <rect x="200" y="600" width="55" height="75" rx="7"/>
    <rect x="210" y="585" width="35" height="15" rx="3"/>
  </g>
  <!-- Recycling symbol -->
  <g transform="translate(300, 400) scale(3)" opacity="0.08" stroke="#68dbae" stroke-width="2" fill="none">
    <path d="M20 8 L12 24 L28 24 Z"/>
    <path d="M8 20 L24 20 L16 36 Z" transform="rotate(120 16 24)"/>
    <path d="M8 20 L24 20 L16 36 Z" transform="rotate(240 16 24)"/>
  </g>
  <g transform="translate(500, 750) scale(2.5)" opacity="0.06" stroke="#68dbae" stroke-width="2" fill="none">
    <path d="M20 8 L12 24 L28 24 Z"/>
    <path d="M8 20 L24 20 L16 36 Z" transform="rotate(120 16 24)"/>
    <path d="M8 20 L24 20 L16 36 Z" transform="rotate(240 16 24)"/>
  </g>
  <!-- Leaf shapes -->
  <g opacity="0.1" fill="#1D9E75">
    <ellipse cx="150" cy="900" rx="80" ry="40" transform="rotate(-30 150 900)"/>
    <ellipse cx="650" cy="150" rx="60" ry="30" transform="rotate(20 650 150)"/>
    <ellipse cx="700" cy="950" rx="90" ry="45" transform="rotate(-15 700 950)"/>
  </g>
  <!-- Bottom wave -->
  <path d="M0 1100 Q200 1050 400 1100 T800 1100 L800 1200 L0 1200 Z" fill="#00694c" opacity="0.15"/>
  <path d="M0 1150 Q200 1100 400 1150 T800 1150 L800 1200 L0 1200 Z" fill="#1D9E75" opacity="0.1"/>
</svg>
